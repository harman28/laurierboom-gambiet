name: Update opponent line-ups
on:
  schedule:
    - cron: "0 6 * * *"   # daily; only commits when Netstand has new line-ups
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_observed.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data.js)" ]; then
            git config user.name "lineup-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.js
            git commit -m "Update opponent line-ups from Netstand"
            git push
          fi
